# 앱까지 컨테이너로 띄운다. 기존 docker-compose.yml 위에 겹쳐 쓴다.
#
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up --build
#
#   docker-compose.yml 은 로컬 개발용 DB 전용이다
#   DB 만 컨테이너로 쓰는 게 개발할 땐 편하다(디버거·핫리로드).

#
#   평소 개발   docker compose up                                     DB 만
#   이미지 확인 docker compose -f ... -f docker-compose.app.yml up     전부

services:
  app:
    build:
      context: .
    container_name: newvent-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy      # DB 가 뜰 때까지 기다린다

    #   .env 가 있으면 그 값을 컨테이너에 넘긴다. 없어도 된다 (required: false).
    #     dev   아무것도 안 넣어도 application-dev.yaml 기본값으로 뜬다
    #     prod  .env 에 JWT_SECRET · CORS_ALLOWED_ORIGINS 를 넣는다 (없으면 기동 실패)
    #   값이 있는 변수만 넘어가므로 프로파일 기본값을 빈 값으로 덮어쓰지 않는다.
    env_file:
      - path: .env
        required: false

    environment:
      #   프로파일 — 기본 dev. 배포(main)에서는 .env 에 SPRING_PROFILES_ACTIVE=prod 를 넣는다.
      #   prod 는 JWT_SECRET · CORS_ALLOWED_ORIGINS 가 없거나 로컬 값이면 기동을 멈춘다 (ProdAuthGuard)
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"

      #   localhost 가 아니라 서비스 이름이다.
      DB_URL: "jdbc:postgresql://postgres:5432/${DB_NAME}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      #   인증(JWT_SECRET · CORS_ALLOWED_ORIGINS · AUTH_COOKIE_*)은 여기 적지 않는다 — 위 env_file 참고.
      #   ★ 여기 "${JWT_SECRET}" 처럼 적으면 값이 없을 때 빈 문자열이 들어가 dev 기본값을 덮어쓴다.
      #     그러면 "JWT_SECRET 이 없습니다." 로 기동하지 못한다 (AuthProps).

      # LLM — 기본은 mock 이라 AWS 자격증명 없이도 뜬다
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_MODEL: "${LLM_MODEL:-}"
      BEDROCK_REGION: "${BEDROCK_REGION:-us-east-1}"

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s               # 스프링 기동이 느리다. 짧으면 계속 unhealthy
