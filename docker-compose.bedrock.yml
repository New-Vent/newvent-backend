# 컨테이너를 **Bedrock 으로** 띄울 때만 겹쳐 쓴다.
#
#   mock (기본)  docker compose -f docker-compose.yml -f docker-compose.app.yml up --build
#   bedrock      docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.bedrock.yml up --build
#
# mock 으로 쓰는 사람은 이 파일을 아예 몰라도 된다. 기존 명령이 그대로 돈다.
#
#   내릴 때
#     docker compose -f docker-compose.yml -f docker-compose.app.yml down --remove-orphans
#
#     `docker compose down` 만 쓰면 앱 컨테이너가 고아로 남는다.
#     기본 파일에 app 정의가 없어서 compose 가 자기 것으로 보지 않는다.
#     경고도 안 뜨고 `Network ... Resource is still in use` 만 남는다.
#     이건 이 파일과 무관하다 — docker-compose.app.yml 을 쓰는 순간 생기는 문제다.
#
#   LLM_PROVIDER 와 자격증명을 한 파일에 묶은 이유
#   따로 두면 provider 만 bedrock 으로 바꾸고 키는 안 넣은 **절반 설정**이 생긴다.
#   둘을 묶어 두면 절반만 켜는 게 불가능하다.
#
#   키가 없으면 어떻게 되나 — BedrockCredentialCheck 가 **기동을 막는다.**
#   처음엔 `${AWS_ACCESS_KEY_ID:?...}` 로 compose 단계에서 막았는데,
#   보간은 파싱 단계라 `up` 뿐 아니라 `down`·`ps`·`logs` 까지 전부 막혔다.
#   검사를 앱으로 옮겨 compose 명령은 자유롭게 두고 실패 시점은 기동 때로 유지한다.
#
#   그때 컨테이너는 죽어 있지 않고 **재시작을 반복한다** (restart: unless-stopped).
#   `docker ps` 에 `Restarting (1)` · `unhealthy` 로 보인다. 로그에는 같은 스택이
#   여러 번 쌓이므로 맨 앞만 보면 된다.
#
#       docker logs newvent-app 2>&1 | head -40
#
#   AWS_REGION 은 넘기지 않는다.
#   BedrockClient 가 .region(BEDROCK_REGION) 을 직접 지정하므로 SDK 기본 리전을
#   볼 일이 없다. 두 군데서 리전을 정하면 어느 쪽이 이겼는지 헷갈린다.

services:
  app:
    environment:
      LLM_PROVIDER: bedrock

      #   기본값을 박아 둔다. 팀이 쓰는 모델은 하나뿐이고(gemma-3-27b),
      #   IAM 정책도 이 모델만 허용한다. 오타로 다른 모델을 부르면 AccessDenied 다.
      LLM_MODEL: "${LLM_MODEL:-google.gemma-3-27b-it}"

      #   gemma 는 ap-northeast-2 에 없다. 서울로 두면 ValidationException 이 난다.
      BEDROCK_REGION: "${BEDROCK_REGION:-us-east-1}"

      #   값이 없으면 빈 문자열이 들어간다. SDK 는 빈 값과 없는 값을 똑같이 다루므로
      #   결과는 "자격증명 없음" 이고, BedrockCredentialCheck 가 기동에서 잡는다.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
