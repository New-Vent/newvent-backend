# 프로파일
#   dev   (기본값) 로컬 개발 — application-dev.yaml. 아무것도 지정하지 않으면 이걸로 뜬다
#   prod           배포 — application-prod.yaml. main 브랜치 배포에서만 켠다 (SPRING_PROFILES_ACTIVE=prod)
spring:
  profiles:
    default: dev
  application:
    name: newvent-backend
  jackson:
    time-zone: Asia/Seoul

  # 스케줄러·@Async 풀. SchedulingConfig 는 스위치만 켠다 (빈 직접 등록 금지)
  task:
    scheduling:
      pool-size: 4
      thread-name-prefix: scheduled-
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
      thread-name-prefix: async-

  # 이미지 업로드. ★ asset.max-bytes(3MB) 보다 넉넉해야 한다 —
  #   여기서 먼저 걸리면 우리 예외가 아니라 톰캣 500 이 나가서 관리자가 이유를 못 듣는다
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/newvent}
    username: ${DB_USERNAME:newvent}
    password: ${DB_PASSWORD:newvent}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway 가 스키마를 만든다
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: 8080

# 인증 — JWT Access Token + Refresh Token(HttpOnly 쿠키)
#
#   ★ 여기 값은 엄격한 쪽이다 (Secure=true, 비밀키 기본값 없음). 프로파일이 덮어쓴다.
#       dev   application-dev.yaml   Secure=false, 개발용 비밀키, localhost:5173·5174 허용
#       prod  application-prod.yaml  Secure=true 고정, 비밀키·허용 Origin 은 환경변수 필수
auth:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  cookie:
    #   ★ 경로·쿠키 이름은 여기 없다. 환경마다 달라지면 안 되므로 코드(AccountType)에 고정했다.
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# LLM — 기본값은 목(mock)

llm:
  # 환경변수 설정하면 Bedrock
  provider: ${LLM_PROVIDER:mock}
  daily-limit: 200      # 하루 최대 호출 수 — 무한루프 방어
  max-retry: 3          # 재시도 상한
  timeout-seconds: 120

  # provider 별 설정
  model: ${LLM_MODEL:}
  region: ${BEDROCK_REGION:}

# OpenAPI 문서 (springdoc)
#
#   /v3/api-docs      OpenAPI 3 JSON — 기계가 읽는다 (프론트 타입 생성·목 서버)
#   /swagger-ui.html  사람이 보는 화면. Try it out 으로 바로 호출된다
#
#   prod 에서는 application-prod.yaml 이 끈다. 공개 서버에 내부 구조를 통째로 열지 않는다.
#   이 문서가 "무엇을 받고 무엇을 주나" 를 맡는다.
#   "왜 이렇게 설계했나" 는 docs/api-design.md · docs/decisions/ 가 맡는다. 섞지 않는다.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 태그·경로를 알파벳순으로 — 컨트롤러 추가 순서에 따라 목차가 흔들리지 않게
    tags-sorter: alpha
    operations-sorter: alpha
    # 기본값은 모든 태그를 펼친 상태라 58개가 한 화면에 쏟아진다
    doc-expansion: none

# Docker 헬스체크
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.newvent: DEBUG

# 올린 이미지
#
# ★ store: local — EC2 한 대에 도커 볼륨으로 둔다. 1.9GB 짜리 박스에 S3 SDK 를
#   얹는 것보다 가볍고, 컨테이너를 다시 올려도 볼륨은 남는다.
#   S3 로 옮길 자리는 AssetStore 하나다 — 구현을 바꿔 끼우면 된다.
# ★ public-base-url 이 **절대 URL** 이어야 한다. 상대 경로는 정화기(jsoup)가
#   src 째로 떼어 버린다 — BlockValidator 의 주석 참고.
asset:
  store: ${ASSET_STORE:local}
  dir: ${ASSET_DIR:/data/assets}
  # ★★ **origin 만** 적는다. 경로는 LocalAssetStore.url() 이 붙인다 —
  #   여기에 /api/public/assets 까지 적으면 주소에 두 번 들어가서 404 가 된다.
  #   배포에서는 https://실제도메인 하나만 넣는다.
  public-base-url: ${ASSET_PUBLIC_BASE_URL:http://localhost:8080}
  max-bytes: 3145728        # 3MB. 배경 한 장에 넉넉하고, 1.9GB 박스가 버틴다
  max-per-event: 20
