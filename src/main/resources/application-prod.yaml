# 배포용 — main 브랜치 배포에서만 켠다.
#
#   SPRING_PROFILES_ACTIVE=prod
#
# ★ 기본값을 두지 않는다. 비밀키 · 허용 Origin 이 빠지면 기동 자체가 실패한다.
#   "기본값으로 조용히 떠서 새로고침할 때마다 로그아웃" 보다 뜨지 않는 게 낫다.
#
# ★ ProdAuthGuard 가 기동 시점에 한 번 더 본다 —
#   Secure 가 꺼져 있거나, 개발용 비밀키이거나, localhost 가 허용돼 있으면 멈춘다.
#
# 필요한 환경변수
#   JWT_SECRET             32바이트 이상 무작위 값 (openssl rand -base64 48)
#   CORS_ALLOWED_ORIGINS   서비스 주소. 예) https://newvent.duckdns.org  (경로·끝 슬래시 없이)
#   AUTH_COOKIE_SAME_SITE  선택. 기본 Lax (같은 도메인 배포)

auth:
  jwt:
    secret: ${JWT_SECRET}
  cookie:
    # ★ 환경변수가 이 파일보다 우선한다 — AUTH_COOKIE_SECURE=false 가 있으면 여기 true 를 덮어쓴다
    #   (스프링이 AUTH_COOKIE_SECURE 를 auth.cookie.secure 로 자동 연결한다).
    #   그래서 막는 건 ProdAuthGuard 다 — Secure 가 꺼진 채로는 기동하지 못한다.
    secure: true
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
