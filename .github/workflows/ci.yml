# .github/workflows/ci.yml
#
# newvent-backend — PR·푸시에서 빌드와 테스트를 돌립니다.
#
# ★ LLM 을 부르지 않습니다.
#   application.yaml 기본값 provider: mock. 프로파일(dev/prod)은 LLM 설정을 바꾸지 않습니다.
#   ollama 등 LLM 프로파일을 여기 넣지 마세요.
#
# ★ 프로파일 — main 대상일 때만 prod
#   main 으로 가는 PR · main push   SPRING_PROFILES_ACTIVE=prod  (배포와 같은 설정으로 검증)
#   그 밖 (develop 등)               SPRING_PROFILES_ACTIVE=dev
#   prod 로 뜨면 ProdAuthGuard 가 Secure · 비밀키 · 허용 Origin 을 검사해 로컬 값이면 기동을 멈춘다.

name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

permissions:
  contents: read

# 같은 브랜치에 연속 푸시하면 이전 실행 취소
#
#   main 만 예외다 — 배포 도중에 취소되면 컨테이너가 반쯤 교체된 상태로 남는다.
#   develop·PR 은 테스트만 도니 취소해도 손해가 없다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # main 대상(PR 의 base 또는 push 한 브랜치)이면 prod, 아니면 dev
      SPRING_PROFILES_ACTIVE: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'prod' || 'dev' }}
      DB_URL: jdbc:postgresql://localhost:5432/${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      # 인증 설정은 배포와 같은 값으로 테스트한다 — Repository secrets 에서 읽는다.
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AUTH_COOKIE_SECURE: ${{ secrets.AUTH_COOKIE_SECURE }}
      AUTH_COOKIE_SAME_SITE: ${{ secrets.AUTH_COOKIE_SAME_SITE }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}

    steps:
      - uses: actions/checkout@v4

      # 빠졌거나 잘못된 값이면 빌드 전에 이유를 적고 멈춘다.
      # (비어 있으면 스프링이 기본값으로 떨어지거나 기동 중에 알아보기 힘든 에러로 죽는다)
      # ★ 값은 출력하지 않는다. 포크에서 온 PR 은 secrets 를 받지 못해 여기서 실패한다.
      - name: 인증 secrets 확인
        run: |
          fail=0
          err() { echo "::error title=secrets::$1"; fail=1; }

          for name in JWT_SECRET AUTH_COOKIE_SECURE AUTH_COOKIE_SAME_SITE CORS_ALLOWED_ORIGINS; do
            [ -n "${!name}" ] || err "Repository secret $name 이(가) 비어 있습니다."
          done

          # HS256 은 키가 32바이트 이상이어야 한다 (짧으면 JwtProvider 생성 시 WeakKeyException)
          if [ -n "$JWT_SECRET" ] && [ "$(printf %s "$JWT_SECRET" | wc -c)" -lt 32 ]; then
            err "JWT_SECRET 은 32바이트 이상이어야 합니다. (openssl rand -base64 48)"
          fi

          case "$AUTH_COOKIE_SECURE" in
            true|false|"") ;;
            *) err "AUTH_COOKIE_SECURE 는 true 또는 false 여야 합니다." ;;
          esac

          case "$AUTH_COOKIE_SAME_SITE" in
            Strict|Lax|"") ;;
            None) [ "$AUTH_COOKIE_SECURE" = "true" ] \
                    || err "AUTH_COOKIE_SAME_SITE=None 은 AUTH_COOKIE_SECURE=true 와 같이 써야 합니다." ;;
            *) err "AUTH_COOKIE_SAME_SITE 는 Strict, Lax, None 중 하나여야 합니다." ;;
          esac

          # CsrfOriginFilter·CORS 는 Origin 을 문자열 그대로 비교한다 — 경로나 끝 슬래시가 붙으면 모두 거부된다
          IFS=',' read -ra origins <<< "$CORS_ALLOWED_ORIGINS"
          for o in "${origins[@]}"; do
            o="${o// /}"
            [[ "$o" =~ ^https?://[^/]+$ ]] \
              || err "CORS_ALLOWED_ORIGINS 의 각 값은 https://도메인 형식이어야 합니다 (경로·끝 슬래시 없이)."
          done

          # prod 로 검증할 때는 배포 값이어야 한다 — 로컬 주소가 섞이면 ProdAuthGuard 가 기동을 멈춘다
          if [ "$SPRING_PROFILES_ACTIVE" = "prod" ]; then
            case "$CORS_ALLOWED_ORIGINS" in
              *localhost*|*127.0.0.1*) err "main(prod) 검증에는 CORS_ALLOWED_ORIGINS 에 로컬 주소를 넣을 수 없습니다." ;;
            esac
          fi
          echo "프로파일: $SPRING_PROFILES_ACTIVE"

          exit $fail

      # 병렬 PR 이 같은 번호로 마이그레이션을 만들면 합쳐진 상태에서 Flyway 가 뜨지 못해
      # 컨텍스트를 쓰는 테스트 수십 개가 한꺼번에 깨진다. 그때 원인이 로그 맨 위에 묻히므로 먼저 알려준다.
      # (pull_request 는 base 와 합쳐진 상태를 체크아웃하므로 develop 과의 충돌도 여기서 잡힌다)
      - name: Flyway 마이그레이션 버전 중복 확인
        run: |
          dir=src/main/resources/db/migration
          dups=$(ls "$dir" | sed -nE 's/^V([0-9]+)__.*/\1/p' | sort -n | uniq -d)
          if [ -n "$dups" ]; then
            for v in $dups; do
              echo "::error title=Flyway::마이그레이션 버전 V$v 이(가) 둘 이상입니다: $(ls "$dir" | grep -E "^V${v}__" | tr '\n' ' ')"
            done
            echo "develop 의 최신 마이그레이션 번호를 확인하고 이 PR 의 번호를 올려주세요."
            exit 1
          fi
          echo "중복 없음 (최신: $(ls "$dir" | sed -nE 's/^V([0-9]+)__.*/\1/p' | sort -n | tail -1))"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'          # build.gradle 의 toolchain 과 같아야 합니다
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 윈도우에서 커밋하면 gradlew 에 실행 권한이 없습니다.
      # 근본 해결:  git update-index --chmod=+x gradlew
      - name: gradlew 실행 권한
        run: chmod +x gradlew

      # build = compileJava + compileTestJava + test + check + bootJar
      # Spotless 를 적용했다면 spotlessCheck 가 check 에 자동으로 붙어
      # 여기서 같이 돕니다. 따로 적지 않아도 됩니다.
      - name: Build
        run: ./gradlew build

      # 이미지가 실제로 빌드되는지 확인한다.
      # push는 배포 워크플로에서.
      - name: Docker 이미지 빌드 확인
        run: docker build -t newvent-backend:ci .

      - name: 테스트 리포트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
            build/reports/spotless
          retention-days: 7

  # ════════════════════════════════════════════════════════════════
  # 배포 — main 푸시에서 build 가 통과한 뒤에만 돈다.
  #
  # ★ 왜 별도 워크플로가 아니라 여기인가
  #   기본 브랜치가 develop 이라, 별도 파일에서 workflow_run 으로 CI 를 기다리게 하면
  #   "기본 브랜치의 워크플로만 트리거된다" 는 제약 때문에 꼬인다.
  #   needs: build 가 "테스트를 통과해야만 배포한다" 를 가장 단순하게 보장한다.
  #
  # ★ 박스에서 빌드하지 않는다 — 여기서 만든 이미지를 ECR 로 보내고 박스는 받기만 한다.
  #   권한도 그렇게 갈라 뒀다: 이 역할은 push 만, 인스턴스 역할은 pull 만.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      id-token: write           # ★ OIDC 에 필수. 워크플로 기본값(contents:read)을 잡 단위로 올린다
      contents: read

    env:
      AWS_REGION: ap-northeast-2
      INSTANCE: i-04fc2a92b84384a2a
      ECR_REPO: newvent-backend

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 태그는 커밋 SHA 다 — 무엇이 떠 있는지 한눈에 알 수 있고 되돌리기도 그 SHA 로 한다.
      - name: 이미지 빌드·푸시
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPO:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "배포할 이미지: $IMAGE"

      - name: EC2 에 배포
        run: |
          # ★ 파라미터 JSON 을 파이썬으로 만든다. 쉘 따옴표로 JSON 을 조립하면 반드시 깨진다.
          #   SSM 이 나르는 건 지시 다섯 줄뿐이고, 이미지는 박스가 ECR 에서 직접 받는다.
          python3 - > params.json <<'PY'
          import json, os, sys
          sha, image = os.environ["GITHUB_SHA"], os.environ["IMAGE"]
          cmd = "\n".join([
              "set -e",
              # SSM Run Command 는 root 로 돌지만 HOME 을 주지 않는다.
              #   git config --global 은 $HOME/.gitconfig 에 쓰려다 `fatal: $HOME not set` 으로 죽고,
              #   docker login 도 $HOME/.docker/config.json 에 쓴다. 둘 다 이 한 줄로 해결된다.
              "export HOME=/root",
              "cd /opt/newvent",
              # 레포가 ssm-user 소유라 root 로 돌리는 git 이 dubious ownership 으로 거부한다.
              "git config --global --add safe.directory /opt/newvent",
              "git fetch --quiet origin",
              # .env 는 .gitignore 라 checkout 이 건드리지 않는다.
              f"git checkout --quiet --detach {sha}",
              f"SHA={sha} IMAGE={image} bash deploy/remote-install.sh",
          ])
          # executionTimeout — SSM 이 서버 쪽 명령을 직접 끊는다.
          #
          #   이게 없으면(기본 3600초) 아래 폴링이 포기한 뒤에도 서버에서는
          #   배포가 계속 돌아 다음 배포와 겹친다. 폴링 한계보다 짧게 잡아
          #   SSM 이 먼저 끊고 TimedOut 으로 보고하게 한다.
          #   (서버 쪽 겹침은 remote-install.sh 의 flock 이 한 겹 더 막는다.)
          json.dump({"commands": [cmd], "executionTimeout": ["600"]}, sys.stdout)
          PY

          ID=$(aws ssm send-command \
                 --instance-ids "$INSTANCE" \
                 --document-name AWS-RunShellScript \
                 --comment "backend ${{ github.sha }}" \
                 --parameters file://params.json \
                 --query Command.CommandId --output text)
          echo "CommandId=$ID"

          # executionTimeout(600초)보다 길게 기다린다 — SSM 이 먼저 끊고 TimedOut 을 주게.
          # 반대로 하면 폴링이 먼저 포기하고 서버 명령만 남아 다음 배포와 겹친다.
          status=Pending
          for _ in $(seq 1 132); do          # 132 × 5초 = 660초 > executionTimeout 600초
            status=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "─── 서버 출력 ───"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text || true

          if [ "$status" != Success ]; then
            echo "::error::배포 실패 ($status)"
            aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
              --query StandardErrorContent --output text || true
            exit 1
          fi

      # 밖에서 실제로 도는지 본다. 여기서 깨지면 배포가 실패로 남아야 한다.
      #
      # ★ /actuator/health 를 쓰지 않는다 — nginx 가 /api/ /auth/ /e/ 만 프록시해서
      #   /actuator/health 는 SPA 폴백에 걸려 백엔드가 죽어도 200(text/html)이 나온다.
      #   상태코드만 보면 거짓 통과한다. 그래서 JSON 본문까지 확인한다.
      - name: 배포 확인
        run: |
          body=$(curl -s -w '\n%{http_code}' https://newvent.duckdns.org/api/public/events)
          code=$(printf '%s' "$body" | tail -1)
          json=$(printf '%s' "$body" | sed '$d')
          echo "HTTP $code"
          echo "$json" | head -c 200; echo
          [ "$code" = 200 ] || { echo "::error::상태코드 $code"; exit 1; }
          echo "$json" | grep -q '"success":true' \
            || { echo "::error::JSON 이 아니거나 success:true 가 아닙니다 — 백엔드가 안 떴을 수 있습니다"; exit 1; }
